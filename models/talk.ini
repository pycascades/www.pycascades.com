[model]
name = Talk
label = {{ this.name }}

[fields.title]
label = Title
type = string

[fields.audience_level]
label = Audience Level
type = string

[fields.abstract]
label = Abstract
type = markdown

[fields.slides]
label = Slides
type = url

[fields.video]
label = Video
type = url

[fields.scheduled_date]
label = Scheduled Time
type = date

[fields.scheduled_time]
label = Scheduled Time
type = string

[fields.speakers]
label = Speakers
type = checkboxes
source = site.query("/speakers").include_undiscoverable(true)


[attachments]
hidden = no
enabled = yes
